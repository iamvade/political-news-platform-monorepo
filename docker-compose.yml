# Local development only. Credentials here are not secrets.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage standing in for Cloudflare R2 locally (MinIO no longer publishes images).
  # Dev credentials and anonymous read on the public bucket only: docker/seaweedfs/s3.json.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
